name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker:
    name: docker build + /health
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t shirdiyatra:ci .

      - name: Run container and hit /health
        run: |
          docker run -d --name shirdi -p 8000:8000 -e PORT=8000 shirdiyatra:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "" && echo "health OK"
              exit 0
            fi
            sleep 2
          done
          docker logs shirdi
          exit 1
