services:
  api:
    build: .
    container_name: shirdiyatra-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ui:
    build: .
    container_name: shirdiyatra-ui
    # Change streamlit_app.py to the name of your Streamlit file.
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      # Inside Docker the UI reaches the API by service name, not localhost.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
